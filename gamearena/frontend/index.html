<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameArena · Panel del administrador</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="estilos.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 mb-3">
  <span class="navbar-brand mb-0 h1">GameArena · Panel del administrador</span>
  <span id="conexion" class="badge bg-secondary">Sin conectar</span>
</nav>

<div class="container">

  <!-- zona de avisos (verde, amarillo o rojo) -->
  <div id="aviso" class="alert d-none" role="alert"></div>

  <ul class="nav nav-tabs" id="panelTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="btnTabTorneos" data-bs-toggle="tab" data-bs-target="#tabTorneos" type="button" role="tab">Torneos</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="btnTabJugadores" data-bs-toggle="tab" data-bs-target="#tabJugadores" type="button" role="tab">Jugadores</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="btnTabVideojuegos" data-bs-toggle="tab" data-bs-target="#tabVideojuegos" type="button" role="tab">Videojuegos</button>
    </li>
  </ul>

  <div class="tab-content border border-top-0 p-3 mb-4">

    <!-- ===================== TORNEOS ===================== -->
    <div class="tab-pane fade show active" id="tabTorneos" role="tabpanel">
      <h2>Torneos</h2>

      <!-- Buscar torneo por ID -->
      <div class="row g-2 align-items-end mb-2">
        <div class="col-auto">
          <label for="buscarTorneoId" class="form-label">Buscar por ID</label>
          <input type="number" id="buscarTorneoId" class="form-control">
        </div>
        <div class="col-auto">
          <!-- GET /torneos/{id}: un torneo por id -->
          <button id="btnBuscarTorneo" class="btn btn-outline-primary" type="button">Buscar</button>
        </div>
        <div class="col">
          <span id="resTorneo"><!-- resultado de la búsqueda --></span>
        </div>
      </div>

      <!-- Filtrar torneos (extend: por estado, videojuego o ambos) -->
      <div class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label for="filtroEstadoTorneo" class="form-label">Estado</label>
          <select id="filtroEstadoTorneo" class="form-select">
            <option value="">Todos</option>
            <option value="ABIERTO">ABIERTO</option>
            <option value="EN_CURSO">EN_CURSO</option>
            <option value="FINALIZADO">FINALIZADO</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="filtroVideojuegoTorneo" class="form-label">Videojuego</label>
          <select id="filtroVideojuegoTorneo" class="form-select">
            <option value="">Todos</option>
            <!-- se rellena reutilizando el GET /videojuegos de la pestaña Videojuegos -->
          </select>
        </div>
        <div class="col-auto">
          <!-- GET /torneos/estado/{estado}: solo filtro de estado -->
          <!-- GET /torneos/videojuego/{videojuegoId}: solo filtro de videojuego -->
          <!-- GET /torneos/videojuego/{videojuegoId}/estado/{estado}: los dos filtros a la vez -->
          <button id="btnFiltrarTorneos" class="btn btn-outline-primary" type="button">Filtrar</button>
        </div>
      </div>

      <table class="table table-striped align-middle">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Fecha</th><th>Premio</th><th>Estado</th><th>Videojuego</th><th>Acciones</th></tr>
        </thead>
        <tbody id="cuerpoTorneos">
          <!-- GET /torneos: aquí se pintarán los torneos al abrir la pestaña -->
          <!-- cada fila lleva 3 botones (a la derecha): Participantes, Editar, Eliminar -->
          <!-- GET /torneos/{id}/participantes -->
          <!-- PUT /torneos/{id} -->
          <!-- DELETE /torneos/{id} -->
        </tbody>
      </table>

      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Torneo</div>
            <div class="card-body" id="formTorneo">
              <div class="mb-2">
                <label for="tNombre" class="form-label">Nombre</label>
                <input type="text" id="tNombre" class="form-control">
              </div>
              <div class="mb-2">
                <label for="tFecha" class="form-label">Fecha</label>
                <input type="date" id="tFecha" class="form-control">
              </div>
              <div class="mb-2">
                <label for="tPremio" class="form-label">Premio</label>
                <input type="number" id="tPremio" class="form-control">
              </div>
              <div class="mb-2">
                <label for="tEstado" class="form-label">Estado</label>
                <select id="tEstado" class="form-select">
                  <option value="ABIERTO">ABIERTO</option>
                  <option value="EN_CURSO">EN_CURSO</option>
                  <option value="FINALIZADO">FINALIZADO</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="tVideojuego" class="form-label">Videojuego</label>
                <select id="tVideojuego" class="form-select" required>
                  <option value="" selected disabled>-- elige un videojuego --</option>
                  <!-- se rellena reutilizando el GET /videojuegos de la pestaña Videojuegos -->
                </select>
              </div>
              <!-- POST /torneos?videojuegoId={id}: crear torneo -->
              <!-- PUT /torneos/{id}: modificar torneo (se reutiliza este mismo formulario) -->
              <button id="btnTorneo" class="btn btn-primary" type="button">Crear torneo</button>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div id="panelParticipantesTorneo" class="card" hidden>
            <div class="card-header" id="tituloParticipantesTorneo">Participantes del torneo</div>
            <div class="card-body">
              <!-- GET /torneos/{id}/participantes: una línea por participante -->
              <div id="listaParticipantesTorneo"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== JUGADORES ===================== -->
    <div class="tab-pane fade" id="tabJugadores" role="tabpanel">
      <h2>Jugadores</h2>

      <div class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label for="buscarJugadorId" class="form-label">Buscar por ID</label>
          <input type="number" id="buscarJugadorId" class="form-control">
        </div>
        <div class="col-auto">
          <!-- GET /jugadores/{id}: un jugador por id -->
          <button id="btnBuscarJugador" class="btn btn-outline-primary" type="button">Buscar</button>
        </div>
        <div class="col">
          <span id="resJugador"><!-- resultado de la búsqueda --></span>
        </div>
      </div>

      <table class="table table-striped align-middle">
        <thead>
          <tr><th>ID</th><th>Nick</th><th>Email</th><th>Nivel</th><th>Acciones</th></tr>
        </thead>
        <tbody id="cuerpoJugadores">
          <!-- GET /jugadores: aquí se pintarán los jugadores -->
          <!-- cada fila lleva 3 botones (a la derecha): Torneos, Editar, Eliminar -->
          <!-- GET /jugadores/{id}/participaciones -->
          <!-- PUT /jugadores/{id} -->
          <!-- DELETE /jugadores/{id} -->
        </tbody>
      </table>

      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Jugador</div>
            <div class="card-body" id="formJugador">
              <div class="mb-2">
                <label for="jNick" class="form-label">Nick</label>
                <input type="text" id="jNick" class="form-control">
              </div>
              <div class="mb-2">
                <label for="jEmail" class="form-label">Email</label>
                <input type="email" id="jEmail" class="form-control">
              </div>
              <div class="mb-3">
                <label for="jNivel" class="form-label">Nivel</label>
                <input type="number" id="jNivel" class="form-control">
              </div>
              <!-- POST /jugadores: crear jugador -->
              <!-- PUT /jugadores/{id}: modificar jugador (se reutiliza este mismo formulario) -->
              <button id="btnJugador" class="btn btn-success" type="button">Crear jugador</button>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div id="panelTorneosJugador" class="card" hidden>
            <div class="card-header" id="tituloTorneosJugador">Torneos del jugador</div>
            <div class="card-body">
              <!-- GET /jugadores/{id}/participaciones: una línea por torneo -->
              <div id="listaTorneosJugador"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== VIDEOJUEGOS ===================== -->
    <div class="tab-pane fade" id="tabVideojuegos" role="tabpanel">
      <h2>Videojuegos</h2>

      <div class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label for="buscarVideojuegoId" class="form-label">Buscar por ID</label>
          <input type="number" id="buscarVideojuegoId" class="form-control">
        </div>
        <div class="col-auto">
          <!-- GET /videojuegos/{id}: un videojuego por id -->
          <button id="btnBuscarVideojuego" class="btn btn-outline-primary" type="button">Buscar</button>
        </div>
        <div class="col">
          <span id="resVideojuego"><!-- resultado de la búsqueda --></span>
        </div>
      </div>

      <table class="table table-striped align-middle">
        <thead><tr><th>ID</th><th>Nombre</th><th>Género</th></tr></thead>
        <tbody id="cuerpoVideojuegos">
          <!-- GET /videojuegos: aquí se pintarán los videojuegos -->
          <!-- sin botón Editar ni Eliminar: el administrador no puede modificar ni eliminar videojuegos -->
        </tbody>
      </table>

      <div class="card card-estrecha">
        <div class="card-header">Videojuego</div>
        <div class="card-body" id="formJuego">
          <div class="mb-2">
            <label for="vjNombre" class="form-label">Nombre</label>
            <input type="text" id="vjNombre" class="form-control">
          </div>
          <div class="mb-3">
            <label for="vjGenero" class="form-label">Género</label>
            <input type="text" id="vjGenero" class="form-control">
          </div>
          <!-- POST /videojuegos: crear videojuego -->
          <button id="btnJuego" class="btn btn-primary" type="button">Crear videojuego</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Inscribir jugador en torneo -->
  <div class="card mb-4">
    <div class="card-header">Inscribir jugador en torneo</div>
    <div class="card-body" id="formInscripcion">
      <div class="row g-2">
        <div class="col-md-4">
          <label for="iJugador" class="form-label">Jugador</label>
          <select id="iJugador" class="form-select" required>
            <option value="" selected disabled>-- elige un jugador --</option>
            <!-- se rellena reutilizando el GET /jugadores de la pestaña Jugadores -->
          </select>
        </div>
        <div class="col-md-4">
          <label for="iTorneo" class="form-label">Torneo</label>
          <select id="iTorneo" class="form-select" required>
            <option value="" selected disabled>-- elige un torneo --</option>
            <!-- se rellena reutilizando el GET /torneos de la pestaña Torneos -->
          </select>
        </div>
        <div class="col-md-2">
          <label for="iPuntos" class="form-label">Puntos</label>
          <input type="number" id="iPuntos" class="form-control">
        </div>
        <div class="col-md-2">
          <label for="iPosicion" class="form-label">Posición</label>
          <input type="number" id="iPosicion" class="form-control">
        </div>
      </div>
      <!-- POST /participaciones?jugadorId={id}&torneoId={id}: inscribir jugador en torneo -->
      <button id="btnInscribir" class="btn btn-success mt-3" type="button">Inscribir</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
